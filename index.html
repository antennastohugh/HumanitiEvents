<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DJ & Event Services | Reviews</title>
  
  <style>
    /* Global CSS Variables - Dark Theme */
    :root {
      --bg-main: #0f0f12;
      --bg-card: #18181c;
      --accent: #7c3aed; /* Electric Purple */
      --accent-hover: #6d28d9;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border-color: #27272a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Header / Hero Section */
    header {
      text-align: center;
      padding: 60px 20px 40px;
      background: linear-gradient(180deg, rgba(124, 58, 237, 0.1) 0%, transparent 100%);
    }

    header h1 {
      font-size: 2.5rem;
      font-weight: 800;
      margin-bottom: 10px;
      letter-spacing: -0.025em;
    }

    header p {
      color: var(--text-muted);
      font-size: 1.1rem;
      max-width: 600px;
      margin: 0 auto;
    }

    /* Main Container */
    main {
      flex: 1;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 0 20px 60px;
    }

    .section-title {
      font-size: 1.5rem;
      margin-bottom: 20px;
      text-align: center;
    }

    /* Cueup Widget Card Wrapper */
    .widget-wrapper {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    /* Dark mode widget container fallback */
    #cueup-reviews {
      width: 100%;
      min-height: 450px;
      background-color: #121215;
      border-radius: 8px;
    }

    /* Footer Section */
    footer {
      border-top: 1px solid var(--border-color);
      padding: 30px 20px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }

    /* Responsive adjustments */
    @media (max-width: 600px) {
      header h1 {
        font-size: 1.8rem;
      }
      
      .widget-wrapper {
        padding: 12px;
      }
    }
  </style>
</head>
<body>

  <!-- Header Section -->
  <header>
    <h1>Client Reviews & Feedback</h1>
    <p>Read real testimonials from past events and gigs, powered directly by Cueup.</p>
  </header>

  <!-- Main Content -->
  <main>
    <div class="widget-wrapper">
      <!-- Cueup Dark Theme Reviews Widget Container -->
      <div 
        id="cueup-reviews" 
        data-cueup-user="YOUR_USERNAME" 
        data-theme="dark"
      ></div>
    </div>
  </main>

  <!-- Footer Section -->
  <footer>
    <p>&copy; 2026 Your Name / DJ Brand. All rights reserved.</p>
  </footer>

  <!-- Cueup Embed Script -->
  <script src="https://cueup.io/embed.js" async defer></script>

</body>
</html>
