<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reviews</title>
  <style>
    /* Global Dark Theme Background */
    body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* Container for the Cueup Widget */
    .widget-container {
      width: 100%;
      max-width: 800px;
      padding: 20px;
      box-sizing: border-box;
    }

    /* Dark mode styling for Cueup widget fallback */
    #cueup-reviews {
      width: 100%;
      min-height: 400px;
      background-color: #1a1a1a;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body>

  <main class="widget-container">
    <!-- Cueup Dark Theme Reviews Container -->
    <div 
      id="cueup-reviews" 
      data-cueup-user="YOUR_USERNAME" 
      data-theme="dark"
    ></div>
  </main>

  <!-- Cueup Embed Script -->
  <script src="https://cueup.io/embed.js" async defer></script>

</body>
</html>
