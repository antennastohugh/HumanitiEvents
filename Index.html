<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Panel Sections</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #ffffff;
      background-color: #0b0f19;
    }

    /* Base Panel Styling */
    .image-panel {
      position: relative;
      min-height: 100vh; /* Full viewport height */
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      overflow: hidden;
      
      /* SECTION DIVIDER BORDERS */
      border-bottom: 4px solid #ffffff;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
    }

    .image-panel:last-of-type {
      border-bottom: none;
    }

    /* Fallback Dark Gradients (Appears if image fails to load) */
    .section-1 {
      background: linear-gradient(135deg, #1e293b, #0f172a);
    }

    .section-2 {
      background: linear-gradient(135deg, #0f172a, #1e1b4b);
    }

    /* Semi-transparent Background Image Layer */
    .image-panel::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      
      /* OPACITY & READABILITY SETTINGS */
      opacity: 0.45; /* Image transparency */
      z-index: 1;
    }

    /* Section 1 Image */
    .section-1::before {
      /* If hosting HTML inside the repo, use relative path: background-image: url('Img%204.png'); */
      background-image: url('https://raw.githubusercontent.com/antennastohugh/HumanitiEvents/main/Img%204.png');
    }

    /* Section 2 Image (Replace with your 2nd image URL when ready) */
    .section-2::before {
      background-image: url('https://raw.githubusercontent.com/antennastohugh/HumanitiEvents/main/Img%204.png');
    }

    /* Text Container Floating Above Background */
    .panel-content {
      position: relative;
      z-index: 2; /* Ensures text stays on top */
      max-width: 800px;
      padding: 3rem 2.5rem;
      background: rgba(15, 23, 42, 0.75); /* Dark frosted glass card */
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(12px); /* Blur background behind card */
      -webkit-backdrop-filter: blur(12px);
    }

    .panel-content h1 {
      font-size: 2.75rem;
      font-weight: 700;
      margin-bottom: 1.25rem;
      color: #ffffff;
      letter-spacing: -0.02em;
    }

    .panel-content p {
      font-size: 1.25rem;
      line-height: 1.7;
      color: #cbd5e1;
    }
  </style>
</head>
<body>

  <!-- Page / Section 1 -->
  <section class="image-panel section-1">
    <div class="panel-content">
      <h1>Section One</h1>
      <p>This panel uses a semi-transparent image background separated by a solid white border line at the bottom.</p>
    </div>
  </section>

  <!-- Page / Section 2 -->
  <section class="image-panel section-2">
    <div class="panel-content">
      <h1>Section Two</h1>
      <p>This is your second page section. Update the CSS for <code>.section-2::before</code> to point to your second image once uploaded.</p>
    </div>
  </section>

</body>
</html>
